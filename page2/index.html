ang-03.jpeg",caption:"汪曾祺 · 影像三",source:"人民文学出版社公众号"}],yearLabel:"1939",yearSource:"https://xsg.tsinghua.edu.cn/info/1004/1753.htm"},{name:"穆旦",city:"长沙",desc:"把苦难踩在脚下的诗人",questions:["路上还想着读书吗？","漫长的路怎样走完？","现在总是想得多、做得少，怎么办？"],answers:["一路艰辛，许多青年学生带着书和字典。路走得很远，读书这件事却始终没有停。","随湘黔滇旅行团从长沙启程，穿过湘西、贵州，直到四月下旬抵达昆明。一步接着一步，就这样走过了山河。","内耗，往往是因为停在原地，想得太远。去吧，别困在焦虑里，把心里的苦，走成脚下的路。"],audio:["../assets/audio/mu-dan-01.mp3","../assets/audio/mu-dan-02.mp3","../assets/audio/mu-dan-03.mp3"],images:[{src:"assets/archive-mudan-01.jpeg",caption:"穆旦 · 影像一",source:"清华校友总会官方平台"},{src:"assets/archive-mudan-02.jpeg",caption:"穆旦 · 影像二",source:"清华校友总会官方平台"},{src:"assets/archive-mudan-03.jpeg",caption:"穆旦 · 影像三",source:"南开大学新闻网"}],yearLabel:"1938",yearSource:"https://www.chinawriter.com.cn/n1/2022/0513/c442005-32420918.html"},{name:"三线建设者",city:"攀枝花",desc:"工人 · 技术人员 · 建设者家属",questions:["他们为什么奔赴西南？","艰苦的建设，靠什么共同撑起？","平凡的工作，留下了什么？"],answers:["他们从不同地方出发，把技术、劳动和生活带到西南。工人、技术人员与建设者家属，在陌生的山河间共同安家，把个人的脚步汇入建设的队伍。","勘测、施工、生产与生活保障，环环相扣。有人架桥修路，有人安装设备，也有人照料一家人的生活。建设的背后，是许多人彼此接力、共同承担。","一条路、一座桥、一间厂房，凝结着许多普通人的劳动。三线建设的群像，既在工业设施里，也在留在这里的家庭、技艺与记忆中。"],images:[{src:"assets/archive-thirdfront-01.jpeg",caption:"三线建设 · 劳动现场",source:"南京记忆博物馆"},{src:"assets/archive-thirdfront-02.jpeg",caption:"三线建设 · 建设现场",source:"南京记忆博物馆"},{src:"assets/archive-thirdfront-03.jpeg",caption:"三线建设 · 生产生活",source:"南京记忆博物馆"}],audio:["../assets/audio/third-front-01.mp3","../assets/audio/third-front-02.mp3","../assets/audio/third-front-03.mp3"],yearLabel:"1964—1980",yearSource:"https://sc.people.com.cn/n2/2021/0517/c345509-34730151.html"}],gL={class:"journey-guide","aria-labelledby":"journey-guide-title"},mL={class:"guide-eyebrow"},yL={id:"journey-guide-title"},vL={class:"guide-intro"},bL=["aria-label","onClick","onMouseenter","onFocus"],wL={class:"waymark-number","aria-hidden":"true"},xL=["src"],_L={class:"waymark-copy"},$L={class:"waymark-city"},CL={key:0},kL={key:1},SL={class:"waymark-action"},TL={key:0,class:"waymark-complete","aria-label":"
